<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A17" />
    <title>Ruchi Vana — Dashboard</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css?v=1" />
    <link rel="stylesheet" href="css/app.css?v=4" />
  </head>
  <body>
    <nav class="navbar navbar-expand-sm rv-navbar">
      <div class="rv-navwrap d-flex flex-wrap align-items-center justify-content-between">
        <a class="navbar-brand rv-brand" href="index.html">Ruchi Vana</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#rvNav"
          aria-controls="rvNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="rvNav">
          <ul class="navbar-nav ms-auto align-items-sm-center gap-1">
            <li class="nav-item">
              <a class="nav-link rv-nav-link active" aria-current="page" href="index.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link rv-nav-link" href="ledger.html">Ledger</a>
            </li>
            <li class="nav-item">
              <button id="logout-btn" class="nav-link rv-nav-link" type="button">Sign out</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="rv-wrap">
      <header class="mb-4">
        <p class="rv-eyebrow">Ruchi Vana</p>
        <h1 class="rv-title rv-page-title">Dashboard</h1>
      </header>

      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <section class="rv-card rv-card-pad h-100">
            <p class="rv-eyebrow" id="month-label">—</p>
            <p class="rv-total" id="month-total">₹0</p>
            <p class="rv-muted mb-0">spent this month, all expenses</p>
            <div class="rv-alltime">
              <span class="rv-num" id="alltime-total">₹0</span>
              <span class="rv-muted">total to date</span>
            </div>
          </section>
        </div>
        <div class="col-12 col-lg-6">
          <section class="rv-card rv-card-pad h-100">
            <p class="rv-eyebrow mb-2">RV owes</p>
            <div id="balances"><p class="rv-muted mb-0">Loading…</p></div>
          </section>
        </div>
      </div>

      <section class="mt-4">
        <p class="rv-eyebrow mb-2">Recent</p>
        <ul class="rv-card rv-list" id="recent">
          <li class="rv-row rv-muted">Loading…</li>
        </ul>
      </section>
    </main>

    <button class="rv-fab" data-action="add" aria-label="Add expense">+</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/dashboard.js?v=4"></script>
  </body>
</html>
